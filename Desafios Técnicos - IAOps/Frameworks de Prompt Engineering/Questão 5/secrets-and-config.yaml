# SECRETS - Dados sensíveis (deve ser criptografado em repouso)
# ⚠️ NUNCA commit este arquivo em Git
# Use: kubectl apply -f secrets-and-config.yaml
# Ou melhor ainda: use sealed-secrets, vault, ou external-secrets
apiVersion: v1
kind: Secret
metadata:
  name: chronos-api-secrets
  namespace: production
  labels:
    app: chronos-api
type: Opaque
stringData:
  # Database
  db-password: "seu-db-password-super-seguro-aqui"
  
  # JWT
  jwt-secret: "seu-jwt-secret-complexo-com-caracteres-especiais"
  
  # API Keys
  api-key: "sua-api-key-segura-aqui"

---
# CONFIGMAP - Configurações não-sensíveis
apiVersion: v1
kind: ConfigMap
metadata:
  name: chronos-api-config
  namespace: production
  labels:
    app: chronos-api
data:
  # URLs e endpoints
  database-url: "postgresql://user@postgres.production.svc.cluster.local:5432/chronos"
  
  # Feature flags
  redis-enabled: "true"
  cache-ttl: "3600"
  
  # Logging
  log-format: "json"
  
  # Timeouts e limites
  request-timeout-seconds: "30"
  max-connections: "100"
  
  # Configuração de saúde
  health-check-interval: "30"
